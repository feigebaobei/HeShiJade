<d-badge
[count]="data.props['count']"
[maxCount]="data.props['maxCount']"
[showDot]="data.props['showDot']"
[status]="data.props['status']"
[offset]="offset"
[bgColor]="data.props['bgColor']"
[textColor]="data.props['textColor']"
>
    <app-stack 
        *ngIf="childComp"
        [componentList]="[childComp]"
    ></app-stack>
</d-badge>
